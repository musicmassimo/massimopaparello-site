name: Deploy to Hostinger (preview)

# Deploys the built site to /public_html/preview on Hostinger — a folder
# scoped FTP account that cannot see or touch /public_html itself (the live
# WordPress site). This never goes near the live site.
#
# One-time setup: in this repo's GitHub Settings → Secrets and variables →
# Actions, add a secret named HOSTINGER_FTP_PASSWORD with the password for
# the u158221593.deploy FTP account. Nothing else is required.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Tells Vite/React Router the site will be served from /preview/,
          # not the domain root — see vite.config.ts and src/App.tsx.
          VITE_BASE_PATH: /preview/

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 46.202.196.3
          username: u158221593.deploy
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          # This FTP account's home directory is already /public_html/preview
          # on the server, so "./" here deploys into that folder — not the
          # live site root.
          server-dir: ./
